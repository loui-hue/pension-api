# Portal en la nube (VPS compartido): solo consultas de los comensales (XP,
# insignias, retos, racha, mis pedidos). Recibe la copia que envía cada 5 minutos
# el servidor de la pensión.
#
# El VPS ya tiene un proxy compartido (caddy-docker-proxy, /srv/proxy) que es el
# único que usa los puertos 80/443 y obtiene el HTTPS de cada proyecto a partir de
# las etiquetas `caddy` de sus contenedores. Este proyecto se publica igual que los
# demás: nginx se une a la red `proxy` con sus etiquetas, sin tocar nada ajeno.
#
# Uso en el VPS (/srv/pension):
#   docker compose -f docker-compose.portal.yml --env-file .env.portal up -d --build
name: pension

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [interna]          # sin puertos publicados: solo la ve el API
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 5s
      retries: 10
    mem_limit: 256m

  api:
    build: .
    restart: unless-stopped
    env_file: .env.portal
    environment:
      DB_HOST: db
      DB_PORT: 5432
      APP_MODE: portal
      APP_ENV: production
      APP_DEBUG: "false"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - public:/var/www/html/public
    networks: [interna]
    mem_limit: 384m

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - public:/var/www/html/public:ro
      # Página de descarga de la app (https://PORTAL_HOST/app/): se descarga desde
      # cualquier lugar, sin depender del servidor de la pensión.
      - ./docker/descargas:/usr/share/nginx/descargas:ro
    depends_on:
      - api
    networks: [interna, proxy]
    labels:
      caddy: ${PORTAL_HOST}
      caddy.reverse_proxy: "{{upstreams 80}}"
    mem_limit: 64m

networks:
  interna: {}
  proxy:
    external: true

volumes:
  pgdata:
  public:
