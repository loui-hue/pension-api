# Servidor local de la pensión: API (PHP-FPM) + PostgreSQL + Nginx.
# Uso: docker compose up -d --build   ->  API en http://<IP-de-esta-PC>:8000/api
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-pension_db}
      POSTGRES_USER: ${DB_USERNAME:-pension_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pension123}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-pension_user} -d ${DB_DATABASE:-pension_db}"]
      interval: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - public:/var/www/html/public
      # Archivos subidos (imagen del QR de la pensión): sobreviven a reconstrucciones
      - uploads:/var/www/html/storage/app

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - public:/var/www/html/public:ro
    depends_on:
      - api

volumes:
  pgdata:
  public:
  uploads:
