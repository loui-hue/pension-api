server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;
    client_max_body_size 10M;
    server_tokens off;   # no anunciar la versión de Nginx

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Página de descarga de la app para el jurado: http://192.168.137.1:8000/app/
    # (se publica con docker/publicar-apk.sh)
    location = /app {
        return 301 /app/;
    }

    location = /app/pension-dona-roberta.apk {
        alias /usr/share/nginx/descargas/pension-dona-roberta.apk;
        default_type application/vnd.android.package-archive;
        types { }
        add_header Content-Disposition 'attachment; filename="pension-dona-roberta.apk"';
        add_header Cache-Control "no-cache";
    }

    location ^~ /app/ {
        alias /usr/share/nginx/descargas/;
        index index.html;
        autoindex off;
        add_header Cache-Control "no-cache";

        location ~ (/\.|plantilla) {
            deny all;
        }
    }

    location ~ \.php$ {
        fastcgi_pass api:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
